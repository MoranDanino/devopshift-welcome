apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    {{- include "helm.labels" . | nindent 4 }}
spec:
  replicas: 3
  selector:
    matchLabels:
      {{- include "helm.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
       {{- include "helm.labels" . | nindent 8 }}
    spec:
      containers:
    #   - name: nginx
    #     image: nginx:1.25.4
      - name: {{ .Values.containers.name }}
        image: "{{ .Values.image.repository }} : {{ .Values.image.tag }}"  # "" - important!     
        ports:
        - containerPort: {{ .Values.service.port }}
        {{- with .Values.resources }}
        resources: 
            {{- toYaml . | nindent 10 }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /
            port: {{ .Values.service.port }}
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: {{ .Values.service.port }}
          initialDelaySeconds: 5
          periodSeconds: 5